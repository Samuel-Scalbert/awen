services:
  awen:
    build: .
    image: awen:latest
    container_name: awen
    restart: unless-stopped          # repart tout seul après une coupure de courant
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      # Chemin DANS le conteneur : le volume data est monté ici.
      DATABASE_URL: sqlite:////app/data/awen.db
      TZ: Europe/Paris
    dns:
      # Sans ceci, le conteneur n'a AUCUN serveur DNS et rien ne sort : ni la
      # meteo, ni Spotify, ni le calendrier. L'hote resout pourtant tres bien,
      # mais son /etc/resolv.conf est ecrit par Tailscale et ne contient que
      # des adresses du tailnet ; Docker n'en retient aucune comme utilisable
      # et fabrique un resolv.conf marque « NO EXTERNAL NAMESERVERS DEFINED ».
      # On donne donc des resolveurs publics explicites. Le conteneur n'a pas
      # besoin des noms du tailnet : il ne parle qu'a l'hote, par
      # host.docker.internal, que Docker inscrit dans /etc/hosts et non dans
      # le DNS.
      - 1.1.1.1
      - 9.9.9.9
    extra_hosts:
      # Ollama tourne sur l'hote, pas ici : lui passer le GPU demanderait
      # nvidia-container-toolkit pour un gain nul, puisqu'il expose deja
      # une API HTTP. Cette ligne donne au conteneur le nom qui resout
      # vers la passerelle Docker, donc vers la machine.
      - "host.docker.internal:host-gateway"
    volumes:
      # La base et les données persistent hors du conteneur : une image
      # reconstruite ne doit jamais emporter l'historique d'entraînement.
      - ./data:/app/data
      # Veille emploi du pipeline Claude cowork, poussée depuis le PC Windows
      # par scripts/sync-jobs.ps1. En lecture seule : Awen n'a aucune raison
      # d'écrire dedans.
      - /srv/recherche-cdi:/srv/recherche-cdi:ro
